name: Bug report
description: Something is wrong in a node, the dispatcher, or the image
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security issues: do **not** file them here. Follow [SECURITY.md](../blob/main/SECURITY.md).
        Never paste API keys, tokens, helper tokens, or customer data into an issue.
  - type: input
    id: version
    attributes:
      label: Image tag or commit
      placeholder: e.g. sq-local/sq-builtin-node-library:2026.09.1 or a commit SHA
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node (templateId / folder)
      placeholder: e.g. nodes/http-request
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour (redacted logs welcome)
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: Minimal invoke body with secrets replaced by placeholders.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I removed all secrets and personal data from this report.
          required: true
        - label: This is not a security vulnerability (otherwise I will use SECURITY.md).
          required: true
