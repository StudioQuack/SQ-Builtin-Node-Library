name: Feature request
description: Propose a new node or a change to an existing one
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can you not do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: New node, new action, new parameter? Which official provider API does it call?
    validations:
      required: true
  - type: input
    id: terms
    attributes:
      label: Provider terms / developer policy URL
      description: Built-in nodes call documented official APIs only (see LEGAL.md).
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: The request does not involve scraping, bypassing access controls, or an unofficial endpoint without an opt-in gate.
          required: true
        - label: If I submit the implementation myself, I will sign off every commit (DCO) and contribute it under Apache-2.0.
